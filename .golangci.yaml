version: "2"

run:
  modules-download-mode: readonly

linters:
  # Enable everything, then subtract. New linters are opt-out, not opt-in.
  default: all
  disable:
    # Constant sentinel errors (type Error string) are the house style.
    - err113
    # Partially initialized structs are normal and readable.
    - exhaustruct
    - exhaustruct_v5
    # Length is not complexity.
    - funlen
    # Bare numbers are fine when the meaning is local and obvious.
    - mnd
    # gofmt does not wrap, and neither do we.
    - lll
    # Blank-line-before-return dogma.
    - nlreturn
    - wsl
    - wsl_v5
    # `if err := f(); err != nil` is idiomatic Go.
    - noinlineerr
    # A helper reads better next to its caller than in an exported/unexported
    # block.
    - funcorder
    # Short names are fine in short scopes.
    - varnamelen
    # t.Parallel everywhere is not a goal.
    - paralleltest
    # Internal test packages are allowed where they earn their keep.
    - testpackage
    # Dependencies are reviewed by hand, not by a wall of config.
    - depguard
    - gomodguard
    # The broker route tables (claudeRoutes, codexRoutes) are read-only
    # package-level slices, and this linter cannot tell them from mutable state.
    - gochecknoglobals

  settings:
    cyclop:
      skip-tests: true
    errcheck:
      check-type-assertions: true
    goconst:
      # A literal repeated in a table-driven test is the test data.
      ignore-tests: true
    govet:
      enable-all: true
      disable:
        # Struct field alignment is not worth the churn.
        - fieldalignment
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
    usetesting:
      # context-background and context-todo default to false even under
      # "enable all" - a test uses t.Context(), not context.Background(),
      # unless the context must outlive the test itself.
      context-background: true
      context-todo: true
    tagliatelle:
      case:
        rules:
          # The nono profile and settings.json use snake_case keys.
          json: snake
    wrapcheck:
      # GO-002 governs wrapping between our own packages; wrapcheck is left to
      # police genuinely opaque third-party and stdlib errors.
      ignore-package-globs:
        - github.com/justenwalker/juggler-sandbox/*
        # Policy: internal/cmd returns Cobra argument errors unwrapped, because
        # Cobra words them for the user. This one entry covers every site.
        - github.com/spf13/cobra

  exclusions:
    generated: lax
    rules:
      # Tests may use globals, sleep, and assertions freely.
      - path: '_test\.go'
        linters:
          - gosec
          - dupl
          - forcetypeassert
          - goconst
          - wrapcheck

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/justenwalker/juggler-sandbox)
  exclusions:
    generated: lax
